description: tisenc (天深医疗 / Tianshen Medical) is a Chinese in-vitro diagnostics (IVD)
  medical-device manufacturer based in Guangdong, backed by Qiming Venture Partners.
  The company develops chemiluminescence immunoassay analyzers and point-of-care testing
  (POCT) systems — its ACCRE 8, ACCRE 90, and ACCRE 120 single-sample chemiluminescence
  platforms and an accompanying reagent menu — together with a digital POCT management
  platform. It is a nationally recognized high-tech enterprise. tisenc operates a corporate
  marketing website only (WordPress/Qifeiye, hosted in China); as of this enrichment pass
  it publishes no public API, developer portal, SDK, or machine-readable specification.
